[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sshconfigmgr"
version = "0.3.0"
description = "TUI for managing SSH client configurations"
requires-python = ">=3.11"
dependencies = [
    # 2.0.0 and 2.0.1 have an OptionList bug where added options are not shown.
    "textual>=0.70.0,!=2.0.0,!=2.0.1",
]

[project.urls]
Homepage = "https://github.com/jwhall/sshconfigmgr"
Repository = "https://github.com/jwhall/sshconfigmgr.git"
Issues = "https://github.com/jwhall/sshconfigmgr/issues"

[project.scripts]
sshconfigmgr = "sshconfigmgr.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sshconfigmgr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
