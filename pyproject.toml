[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sshconfigmgr"
version = "0.2.0"
description = "TUI for managing SSH client configurations"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.70.0",
]

[project.urls]
Homepage = "https://github.com/jwhall/sshconfigmgr"
Repository = "https://github.com/jwhall/sshconfigmgr.git"
Issues = "https://github.com/jwhall/sshconfigmgr/issues"

[project.scripts]
sshconfigmgr = "sshconfigmgr.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sshconfigmgr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
